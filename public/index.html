<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MMA.bg Product Robot</title>
  <style>
    body{font-family:Arial,sans-serif;background:#0e1116;color:#fff;margin:0;padding:40px} .wrap{max-width:980px;margin:auto}
    h1{margin:0 0 8px}.muted{color:#9aa4b2}.card{background:#171c24;border:1px solid #2a3240;border-radius:16px;padding:20px;margin:18px 0}
    button{background:#fff;color:#111;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;margin-right:8px;margin-bottom:8px}
    pre{white-space:pre-wrap;word-break:break-word;background:#090c10;padding:16px;border-radius:12px;max-height:560px;overflow:auto}
    input{width:min(700px,100%);padding:12px;border-radius:10px;border:1px solid #384152;background:#0d1117;color:#fff;box-sizing:border-box;margin:8px 0 12px}
  </style>
</head>
<body><div class="wrap">
  <h1>MMA.bg Product Robot</h1><div class="muted">Vercel test panel</div>
  <div class="card">
    <button onclick="run('/api/discover')">1. Намери продуктите</button>
    <button onclick="run('/api/sync?limit=5&persist=0')">2. Изтегли 5 продукта</button>
  </div>
  <div class="card">
    <div>Тест на конкретен продукт:</div>
    <input id="url" placeholder="https://mma.bg/shop/..." />
    <button onclick="one()">Провери продукта</button>
  </div>
  <pre id="out">Натисни бутон за тест.</pre>
</div>
<script>
async function run(url){
  const out=document.getElementById('out'); out.textContent='Зарежда...';
  try{const r=await fetch(url); const j=await r.json(); out.textContent=JSON.stringify(j,null,2)}catch(e){out.textContent=e.message}
}
function one(){const v=document.getElementById('url').value.trim(); if(!v)return; run('/api/product?url='+encodeURIComponent(v))}
</script></body></html>
